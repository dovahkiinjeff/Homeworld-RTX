name: Feature request
description: Propose a scoped renderer, UI, gameplay, or authoring improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Renderer / DXR
        - Map editor
        - Lighting / shadow editor
        - Interface
        - Gameplay option
        - Build / compatibility
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or creative goal
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Simulation, save, multiplayer, or licensing considerations
